# Synmergia Production VPS
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Required env vars (in .env):
#   POSTGRES_PASSWORD=your_secure_password
#   JWT_SECRET=your_jwt_secret
#
# Optional:
#   DOMAIN=play.synmergia.com  # For Let's Encrypt
#   CERT_EMAIL=admin@example.com  # For Let's Encrypt
#   REDIS_ENABLED=true  # Enable Redis cache layer
#   SQLITE_ENABLED=false  # Enable SQLite for lightweight instances

services:
  synmergia:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "9000:9000"   # Game WebSocket
    environment:
      - GODOT_MODE=run
      - GODOT_PORT=9000
      - POSTGRES_DB=synmergia
      - POSTGRES_USER=synmergia
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - SQLITE_ENABLED=${SQLITE_ENABLED:-false}
    volumes:
      - synmergia-data:/var/lib/synmergia
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - synmergia-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=synmergia
      - POSTGRES_USER=synmergia
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synmergia"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - synmergia-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - synmergia-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro  # SSL certs (optional)
      - nginx-html:/var/www/html  # ACME challenge
    depends_on:
      - synmergia
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - synmergia-net

  # Let's Encrypt certificate generation (run once to get certs)
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - ./certs:/etc/letsencrypt
  #     - nginx-html:/var/www/html
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h; certbot renew; done'"
  #   command: certonly --webroot -w /var/www/html --email ${CERT_EMAIL:-admin@localhost} -d ${DOMAIN:-localhost} --agree-tos --noninteractive

  # Julia modeling pipeline (for hot math / content generation)
  # Uncomment to enable Julia runtime for server-side calculations
  # julia:
  #   image: julia:1.11
  #   volumes:
  #     - ./models:/workspace/project/synmergia/models
  #   working_dir: /workspace/project/synmergia/models
  #   networks:
  #     - synmergia-net

volumes:
  postgres-data:
  redis-data:
  synmergia-data:
  nginx-html:

networks:
  synmergia-net:
    driver: bridge
