name: Godot Tests

on:
  push:
    branches: [staging]
    paths:
      - 'game/**'
      - 'scripts/**'
      - '.github/workflows/godot-ci.yml'
  pull_request:
    branches: [staging, main]
    paths:
      - 'game/**'
      - 'scripts/**'
      - '.github/workflows/godot-ci.yml'

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  default-set:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: '4.7.2'
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip libfontconfig1
      - name: Install Godot
        run: |
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /tmp/godot/godot
          chmod +x /tmp/godot/godot
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Warm the class cache
        run: godot --headless --path game --import
      - name: Run the default regression set
        run: sh ./scripts/godot_test_runner.sh
