name: Godot CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: "4.2.2"

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:${{ env.GODOT_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Project
        run: |
          godot --headless --check-only
