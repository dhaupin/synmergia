name: Tres Relation Gate

# Synmergia is the FIRST CONSUMER of the .tres relation standard (tresridge).
# This lane is the teeth: the declaration in game/data/relations.json is judged
# against the tree on every change to the data or the generator, so a dangling
# or undeclared reference fails the build instead of surfacing in playtest.
#
# The linter is a PINNED VERSION from npm, not a branch (the family's
# pinned-linter rule: a floating linter is a random CI). `1.1.0` is exact - no
# `^`, no `~` - so the gate cannot drift under us between runs. When the pin
# moves, re-derive the declaration in the SAME commit.
#
# tresridge is PUBLIC on npm, so the install is anonymous: no token, no secret,
# and a fork's pull request runs the same lane as `main`. That is deliberate - a
# gate that needs a secret is a gate that silently skips on a fork, which is the
# failure mode this lane exists to catch.
#
# This pin replaced a commit pin (0057c57), which existed only because the
# standard was unpublished. The version pin is the forward move: npm serves the
# tarball with provenance, and the tag is the artifact rather than a git SHA.

on:
  push:
    branches: [staging, main]
    paths:
      - 'game/data/**'
      - 'scripts/gen-relations.mjs'
      - '.github/workflows/tres-ci.yml'
  pull_request:
    branches: [staging, main]
    paths:
      - 'game/data/**'
      - 'scripts/gen-relations.mjs'
      - '.github/workflows/tres-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tres-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pinned standard. An exact version, never a range - see the header.
  #
  # 1.1.0 carries the reader seam (`--reader`) and the type declarations. The
  # declaration in game/data/relations.json was re-derived under this exact
  # version in the commit that moved the pin: `graph --against` reports 0
  # added / 0 removed / 0 changed, and the generator reproduces the committed
  # file byte for byte, so the pin move is proven inert before it lands.
  #
  # The canary step below is what stops a pin from landing on a linter that
  # passes everything - it asserts a refusal (wrong root) and an acceptance
  # (correct root), so neither a broken pin nor a permissive one can pass.
  TRESRIDGE_VERSION: 1.1.0

jobs:
  relation-gate:
    name: Relation gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Install the standard at the pinned version. Zero runtime deps, so the
      # CLI runs straight from node_modules - no build step.
      #
      # The tarball is fetched anonymously (the package is public), so this
      # works identically on a fork's PR. An unreachable pin is a named
      # refusal, not a skip: a lane that quietly does nothing when it cannot
      # install is the silent pass this gate exists to prevent.
      - name: Install the pinned standard
        run: |
          mkdir -p "$RUNNER_TEMP/tres"
          cd "$RUNNER_TEMP/tres"
          npm init -y >/dev/null 2>&1
          if ! npm install --no-fund --no-audit --no-save "tresridge@$TRESRIDGE_VERSION" >/dev/null 2>&1; then
            echo "::error::Cannot install tresridge@$TRESRIDGE_VERSION from npm. The pin is unreachable - check that the version exists and that the package is public."
            exit 1
          fi
          CLI="$RUNNER_TEMP/tres/node_modules/tresridge/bin/cli.mjs"
          if [ ! -f "$CLI" ]; then
            echo "::error::tresridge@$TRESRIDGE_VERSION installed but ships no bin/cli.mjs. The package shape changed - bump the pin deliberately."
            exit 1
          fi
          echo "pinned standard: $(node "$CLI" --version)"

      # The pin is a linter with known behaviour, so assert that behaviour
      # before trusting its verdict. Without this, moving TRESRIDGE_VERSION can
      # silently move the gate onto a linter that passes everything.
      - name: Pin canary (the pinned linter still refuses a wrong root)
        run: |
          CLI="$RUNNER_TEMP/tres/node_modules/tresridge/bin/cli.mjs"
          T="$RUNNER_TEMP/canary"
          mkdir -p "$T/tree/zones" "$T/tree/npcs"
          printf 'script_class="ZoneData"\nid = "zn_a"\n' > "$T/tree/zones/zn_a.tres"
          printf 'script_class="NpcData"\nid = "npc_a"\nzone_id = "zn_a"\n' > "$T/tree/npcs/npc_a.tres"

          # `$T` is one level ABOVE the tree root (`$T/tree`), so every record
          # collapses into a single family and no edge can resolve. That is the
          # shape that used to report "0 edges inferred" and exit 0.
          set +e
          node "$CLI" graph "$T" >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::The pinned linter accepted a root above the tree root (exit $code, want 2). It is passing a tree it cannot judge - bump TRESRIDGE_VERSION to a release that carries the root guard."
            exit 1
          fi

          # ...and the same linter must accept the correct root, or the canary
          # only proves that it refuses everything.
          node "$CLI" graph "$T/tree" >/dev/null 2>&1
          echo "canary: wrong root refused (2), correct root accepted (0)."

      # The verdict: every declared edge resolves; no undeclared _id; no cycles.
      - name: Lint the declaration against the tree
        run: node "$RUNNER_TEMP/tres/node_modules/tresridge/bin/cli.mjs" lint game/data --decl game/data/relations.json

      # The drift gate: the declaration the tree implies must match the committed
      # one. A record that quietly stopped being referenced fails here.
      - name: Drift gate (graph --against)
        run: node "$RUNNER_TEMP/tres/node_modules/tresridge/bin/cli.mjs" graph game/data --against game/data/relations.json

      # The generator is the one source of the declaration; it must be
      # deterministic, or the committed artifact is not reproducible.
      - name: Declaration is reproducible (regenerate == committed)
        env:
          TRESRIDGE: ${{ runner.temp }}/tres/node_modules/tresridge/bin/cli.mjs
        run: |
          node scripts/gen-relations.mjs > "$RUNNER_TEMP/relations.regen.json"
          if ! diff -q "$RUNNER_TEMP/relations.regen.json" game/data/relations.json; then
            echo "relations.json is stale: run 'npm run gen:relations' (or scripts/gen-relations.mjs --write) and commit the result."
            diff "$RUNNER_TEMP/relations.regen.json" game/data/relations.json || true
            exit 1
          fi
          echo "relations.json matches a fresh generation."
