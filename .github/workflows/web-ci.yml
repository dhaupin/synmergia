name: Web PCK & Validation CI

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'game/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: 'Run all Godot test suites (High action minutes cost)'
        required: false
        default: false
        type: boolean
      force_export:
        description: 'Force full wasm export even on main'
        required: false
        default: false
        type: boolean

# Cancel running workflows on the same branch when a new push occurs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  # Exact templates dir name Godot looks up (must match the engine's
  # version string, not the release tag).
  TEMPLATES_DIR: "4.7.2.stable"

jobs:
  validate-and-pack:
    name: Validate & Export Web PCK
    # Pinned: ubuntu-latest began migrating to Ubuntu 26 on 2026-10-19
    # (see the workflow annotation); a floating runner tag lets that
    # migration silently break the import/export toolchain. Pin until
    # a deliberate upgrade wants to move it forward.
    runs-on: ubuntu-24.04
    # Historical note: the old value was 3 minutes and every run died at
    # the syntax-check step, because a fresh checkout re-imports the whole
    # project inside the first engine invocation. The .godot/ cache below
    # makes warm runs take seconds; 10 minutes covers the cold import.
    timeout-minutes: 10
    permissions:
      # contents: write lets the push path commit the refreshed pck back
      # as github-actions[bot]; PR runs never commit (guarded below).
      contents: write
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Cache Godot Headless Binary
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: /home/runner/godot-bin
          key: godot-headless-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot 4.7.2 Headless (if not cached)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/godot-bin
          echo "Downloading standalone Godot 4.7.2 headless binary (~50MB)..."
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /home/runner/godot-bin/
          mv "/home/runner/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /home/runner/godot-bin/godot
          chmod +x /home/runner/godot-bin/godot
          rm -f /tmp/godot.zip

      - name: Add Godot to PATH
        run: |
          echo "/home/runner/godot-bin" >> $GITHUB_PATH

      # The .godot/ import cache is what makes CI viable: without it every
      # run re-imports all assets inside the first engine boot (the old
      # workflow's 3m07s hang). Keyed on game content + engine version.
      - name: Cache Godot Import Cache (.godot/)
        uses: actions/cache@v6
        with:
          path: game/.godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('game/**', 'game/project.godot') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      - name: Resource Import (incremental, also validates resources)
        run: |
          echo "Importing resources (incremental when cache hit)..."
          godot --headless --path game/ --import

      - name: Lint Charset & Syntax
        run: |
          godot --headless --path game/ -s res://tests/lint/test_lint_charset.gd || exit 1
          godot --headless --path game/ -s res://tests/lint/test_lint_syntax.gd || exit 1

      - name: Smoke Tests (parse + autoload audit)
        run: |
          godot --headless --path game/ -s res://tests/lint/test_lint_autoload.gd || exit 1
          godot --headless --path game/ -s res://tests/test_parse_check.gd || exit 1

      # Fast, always: re-pack game.pck on every push (prd-web.md 3.3
      # "PCK-Only Workflow", <5s, no engine compilation). web/game.pck is
      # gitignore-whitelisted and tracked, so the artifact stays deployable.
      - name: Export Web PCK (push path, per PRD strategy 2)
        run: |
          mkdir -p web
          # Build stamp: bake the packed content's git hash into
          # project settings so the in-game truth line can PROVE which
          # content commit the running client holds (screenshot ->
          # commit, the anti-stale-pck check). Local dev packs read
          # "dev".
          CONTENT_HASH=$(git rev-parse --short HEAD)
          if grep -q '^application/config/build_hash=' game/project.godot; then
            sed -i "s|^application/config/build_hash=.*|application/config/build_hash=\"$CONTENT_HASH\"|" game/project.godot
          else
            printf 'application/config/build_hash="%s"\n' "$CONTENT_HASH" >> game/project.godot
          fi
          echo "Stamping pck content at $CONTENT_HASH"
          echo "Exporting Web PCK bundle..."
          godot --headless --path game/ --export-pack "Web" "../web/game.pck"
          ls -lh web/game.pck
          # Content-addressed cache-buster: game.html fetches this and
          # requests game.pck?v=<sha256> (immutable); the worker 302s
          # the bare path here too. Tracked so it deploys with the pck.
          sha256sum web/game.pck | awk '{print $1}' > web/game.pck.hash
          cat web/game.pck.hash

      # Close the drift loop: the served client reads the TRACKED
      # web/game.pck, so a push that changes game content must land its
      # fresh pack in the repo, not just in an artifact. Commit-back is
      # push-to-main only (PRs and dispatch leave the branch alone) and
      # skips cleanly when the pack is unchanged. No re-trigger loop:
      # the resulting commit touches only web/, which the push-path
      # filter (game/**) does not match. wasm stays artifact-only per
      # PRD 3.3 -- it never rides this step.
      - name: Commit Fresh PCK (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/game.pck web/game.pck.hash
          if git diff --cached --quiet; then
            echo "PCK unchanged since HEAD -- nothing to commit"
          else
            git commit -m "ci: refresh web/game.pck (game content at ${GITHUB_SHA::7})"
            # Race guard: another commit may have landed mid-run; rebase
            # the bot commit on top. If this still fails, the newer
            # commit's own run re-exports and self-heals.
            git pull --rebase origin main || true
            git push
            echo "Pushed refreshed pck as $(git rev-parse --short HEAD)"
          fi

      - name: Optional Full Test Suite
        if: ${{ github.event.inputs.run_full_suite == 'true' }}
        run: |
          echo "Executing full test suite per manual workflow dispatch..."
          for test_script in $(find game/tests -name "test_*.gd" | sort); do
            echo "Running ${test_script}..."
            godot --headless --path game/ -s "${test_script}" || true
          done

      # Full wasm bundle: PRs and manual dispatch only (PRD 3.3 - never burn
      # free-tier minutes compiling wasm on routine pushes). The export
      # templates download is cached; the tpz unpacks into a templates/
      # subdir that must be flattened into the exact engine version dir.
      - name: Cache Web Export Templates
        id: cache-templates
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v6
        with:
          path: /home/runner/.local/share/godot/export_templates/${{ env.TEMPLATES_DIR }}
          key: godot-web-templates-${{ env.GODOT_VERSION }}

      - name: Download Export Templates (if not cached)
        if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          DEST="/home/runner/.local/share/godot/export_templates/${TEMPLATES_DIR}"
          mkdir -p "$DEST"
          echo "Downloading Godot export templates (~800MB, cached after first run)..."
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates/
          # tpz contains a templates/ dir; flatten into the version dir.
          if [ -d /tmp/templates/templates ]; then
            mv /tmp/templates/templates/* "$DEST/"
          else
            mv /tmp/templates/* "$DEST/"
          fi
          rm -f /tmp/templates.tpz
          ls "$DEST" | head -4

      - name: Export Web Game (full wasm bundle)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.inputs.force_export == 'true'
        run: |
          echo "Exporting full Web build (wasm bundle)..."
          # Godot 4 removed --export; the release export is --export-release.
          # The STOCK shell exports OUTSIDE web/ (builds/web-shell/):
          # web/index.html is the hand-maintained shell (input bridge,
          # hash bootstrap) that the app actually serves -- a stock-shell
          # export into web/ would silently clobber it.
          godot --headless --path game/ --export-release "Web" "../builds/web-shell/game.html"
          ls -lh web/ builds/web-shell/

      # Storage-quota law: artifact upload is PR/dispatch ONLY. Push
      # runs are redundant here — the pck is committed back to the repo
      # by the step above, and the game.wasm in a push artifact is just
      # the stale tracked copy (full wasm export never runs on push, per
      # PRD 3.3). Thirty-eight ~18 MB push artifacts breached the 500 MB
      # storage quota and every run since has died at this step; the
      # churn (retention-days) cannot delete faster than busy-week pushes
      # fill. Short retention + few uploads keeps the accounting honest.
      - name: Upload Web Game Artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: synmergia-web-game
          path: |
            web/game.pck
            web/game.js
            web/game.wasm
            web/game.png
            web/game.audio.worklet.js
            web/game.audio.position.worklet.js
          retention-days: 3
          if-no-files-found: warn
