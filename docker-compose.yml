# Synmergia Docker - Development
# Usage: docker compose up --build
#
# Screenshot/agent tooling:
#   node synmergia/scripts/screenshot.js --output captures/screenshots/main-menu.png
#   node synmergia/scripts/screenshot.js --video 30

services:
  synmergia:
    build: .
    ports:
      - "80:80"       # HTTP
      - "6080:6080"   # noVNC (browser) — connect here for game UI
      - "5900:5900"   # VNC (raw)
      - "9000:9000"   # WebSocket
    volumes:
      - ./synmergia:/workspace/project/synmergia:ro
      - ./captures:/workspace/project/synmergia/captures
    environment:
      - DISPLAY=:99
      - GODOT_MODE=dev
    shm_size: 256mb  # Xvfb needs shared memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
