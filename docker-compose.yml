# ============================================================================
# Synmergia — Docker Compose
#
# One file. Pick a profile. Works for dev, prod, and headless.
#
# Profiles:
#   dev       — Xvfb + noVNC + nginx + Godot GUI  (default)
#   prod      — nginx + Godot headless + postgres + redis
#   headless  — Godot headless only (CI / bot runner)
#
# Usage:
#   docker compose up               # dev (default)
#   docker compose --profile dev up --build
#   docker compose --profile prod up --build
#   docker compose --profile headless up --build
#
# Environment (override in .env):
#   START_MODE=dev|prod|headless
#   GODOT_PORT=9000
#   POSTGRES_PASSWORD=...
#   JWT_SECRET=...
#   DOMAIN=play.example.com
#   CERT_EMAIL=admin@example.com
# ============================================================================

services:
  # ── Synmergia App (all modes) ─────────────────────────────────────────────
  synmergia:
    build: .
    profiles:
      - dev
      - prod
      - headless
    ports:
      - "80:80"
      - "443:443"
      - "6080:6080"
      - "5900:5900"
      - "9000:9000"
    environment:
      - START_MODE=${START_MODE:-dev}
      - GODOT_PORT=${GODOT_PORT:-9000}
      - GODOT_UPSTREAM=${GODOT_UPSTREAM:-synmergia:${GODOT_PORT:-9000}}
      # ── Edge transport (shard mesh Phase 2) ─────────────────────────────────
      # enet (default) keeps the raw UDP server. websocket lets nginx front
      # the shard with sticky routing (ip_hash) so browser + native clients
      # share one L7 entry. A mesh sets EDGE_TRANSPORT=websocket and points
      # GODOT_UPSTREAM at a comma-separated list of shard hosts.
      - EDGE_TRANSPORT=${EDGE_TRANSPORT:-enet}
      - POSTGRES_DB=synmergia
      - POSTGRES_USER=synmergia
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-synmergia_dev_pass}
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_ENABLED=true
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      # ── Shared state (shard mesh) ───────────────────────────────────────────
      # Defaults keep dev/CI on in-process memory (byte-identical to before).
      # For a multi-shard deploy set, per container:
      #   STORAGE_BACKEND=postgres CACHE_BACKEND=redis
      #   PG_BACKEND=postgres     REDIS_BACKEND=redis
      # The bridges read PG_BACKEND/REDIS_BACKEND; the engine reads
      # STORAGE_BACKEND/CACHE_BACKEND and talks to the bridges over HTTP.
      - STORAGE_BACKEND=${STORAGE_BACKEND:-memory}
      - CACHE_BACKEND=${CACHE_BACKEND:-memory}
      - PG_BACKEND=${PG_BACKEND:-sqlite}
      - REDIS_BACKEND=${REDIS_BACKEND:-inmemory}
      - PG_BRIDGE_URL=${PG_BRIDGE_URL:-http://127.0.0.1:8080}
      - REDIS_BRIDGE_URL=${REDIS_BRIDGE_URL:-http://127.0.0.1:8081}
      # ── Shard identity (shard mesh) ─────────────────────────────────────────
      # Unset -> shard_1 / Alpha (the single-node default). A mesh sets a
      # unique SHARD_ID per container; ShardManager reads these at boot.
      - SHARD_ID=${SHARD_ID:-}
      - SHARD_NAME=${SHARD_NAME:-}
      - IS_PRIMARY=${IS_PRIMARY:-}
    volumes:
      - synmergia-data:/var/lib/synmergia
      # Mount the Godot project (synmergia/game/) as the container's /workspace/project/game/
      # This makes the project read-writable so Godot can run and save state.
      # The project path convention is /workspace/project/game per Dockerfile GODOT_PATH.
      - ./game:/workspace/project/game
      # Mount labs/ for the multi-iso frame work (experiments outside Godot project)
      - ./labs:/workspace/project/labs
    shm_size: 256mb  # Xvfb needs shared memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - synmergia-net

  # ── PostgreSQL (dev + prod profiles) ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    profiles:
      - dev
      - prod
    environment:
      - POSTGRES_DB=synmergia
      - POSTGRES_USER=synmergia
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-synmergia_dev_pass}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
      - TZ=UTC
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c work_mem=16MB
      -c max_connections=100
      -c tcp_keepalives_idle=60
      -c tcp_keepalives_interval=10
      -c tcp_keepalives_count=6
      -c log_statement=all
      -c log_min_duration_statement=1000
      -c idle_in_transaction_session_timeout=60000
      -c statement_timeout=30000
      -c timezone=UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synmergia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - synmergia-net

  # ── Redis (dev + prod profiles) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    profiles:
      - dev
      - prod
    command: >
      redis-server
      --appendonly yes
      --save 60 1
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --rdbcompression yes
      --maxmemory-samples 5
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - synmergia-net

  # NOTE: Frame HTTP bridge extraction to srv/frame/ was DEFERRED (see
  # world-building-arch.md sec. 11.2). Rules/Scope/T3 evaluate in-process
  # via FrameClient's local fallback, so no frame container is defined.
  # The frame service block was removed: it pointed at a nonexistent
  # srv/frame/Dockerfile and broke `docker compose --profile dev/prod up --build`.

  # ── Certbot (prod, run-once to get HTTPS certs) ─────────────────────────
  # Run once: docker compose --profile prod run --rm certbot
  # Then uncomment HTTPS in nginx.conf and restart.
  certbot:
    image: certbot/certbot
    profiles:
      - prod
    volumes:
      - ./srv/certs:/etc/letsencrypt
      - nginx-html:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h; certbot renew; done'"
    command: >
      certonly --webroot -w /var/www/html
      --email ${CERT_EMAIL:-admin@localhost}
      -d ${DOMAIN:-localhost}
      --agree-tos --noninteractive --keep-until-expiring
    restart: unless-stopped
    networks:
      - synmergia-net

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  synmergia-data:
  postgres-data:
  redis-data:
  nginx-html:

# ── Network ────────────────────────────────────────────────────────────────
networks:
  synmergia-net:
    driver: bridge
