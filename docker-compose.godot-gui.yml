# Docker Compose for Godot GUI testing
# Usage: docker compose -f docker-compose.godot-gui.yml up

services:
  godot-gui:
    build:
      context: .
      dockerfile: Dockerfile.godot-gui
    ports:
      - "6080:6080"  # noVNC web interface
      - "5900:5900"  # VNC
    environment:
      - DISPLAY=:99
    volumes:
      - ./synmergia:/workspace/project/synmergia:ro
    restart: unless-stopped
    networks:
      - godot-network

networks:
  godot-network:
    driver: bridge
