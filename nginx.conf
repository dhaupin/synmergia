events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript;

    upstream godot {
        server synmergia:9000;
    }

    server {
        listen 80;
        server_name _;

        # Redirect to HTTPS in production
        # return 301 https://$host$request_uri;

        root /workspace/project/synmergia;
        index index.html;

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Static files (game client, assets)
        location /client/ {
            alias /workspace/project/synmergia/client/;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        location /assets/ {
            alias /workspace/project/synmergia/assets/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Authentication API
        location /api/auth/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://godot;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Account management
        location /api/account/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://godot;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Game WebSocket
        location /game {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://godot;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Client-ID $http_x_client_id;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Admin dashboard (if served by game server)
        location /admin {
            proxy_pass http://godot;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Default - serve static or 404
        location / {
            try_files $uri $uri/ =404;
        }
    }

    # HTTPS server (uncomment for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name play.synmergia.com;
    #
    #     ssl_certificate /certs/fullchain.pem;
    #     ssl_certificate_key /certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #
    #     # Same locations as above...
    # }
}
