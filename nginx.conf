events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/wasm;

    # Godot upstream
    # In single-container mode: localhost:9000
    # In compose (multi-container) mode: synmergia:9000 (set via GODOT_UPSTREAM)
    upstream godot {
        server GODOT_UPSTREAM;
    }

    # HTTP server
    server {
        listen 80;
        server_name _;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        # Redirect HTTP to HTTPS when certs exist
        # Uncomment this line when you have SSL certificates
        # return 301 https://$host$request_uri;

        root /var/www/html;
        index index.html;

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Static files
        location /client/ {
            alias /workspace/project/game/client/;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        location /assets/ {
            alias /workspace/project/game/assets/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Proxy to Godot services
        location ~ ^/(api/auth|api/account|game|ws|admin)/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://godot;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Client-ID $http_x_client_id;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location /ws/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://godot;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    # HTTPS server
    # Default: self-signed certs (built into image at /etc/nginx/ssl/)
    # For Let's Encrypt: bind-mount certs dir to /etc/letsencrypt/ in docker-compose
    #   volumes:
    #     - ./certs:/etc/letsencrypt:ro
    #   Then nginx auto-selects: self-signed if no LE certs, LE certs if they exist.
    server {
        listen 443 ssl http2;
        server_name _;

        # Use Let's Encrypt certs if mounted, else fall back to self-signed
        ssl_certificate /etc/letsencrypt/live/localhost/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/localhost/privkey.pem;

        # Fallback: self-signed certs (always present in image)
        # If the LE path above doesn't exist, nginx will fail to start with this alone.
        # We handle this in the entrypoint via a conditional config snippet.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;

        root /var/www/html;
        index index.html;

        # Static files
        location /client/ {
            alias /workspace/project/game/client/;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        location /assets/ {
            alias /workspace/project/game/assets/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Proxy to Godot services
        location ~ ^/(api/auth|api/account|game|ws|admin)/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://godot;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Client-ID $http_x_client_id;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location /ws/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://godot;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
