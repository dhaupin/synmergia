<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Synmergia - Agent Control Surface</title>
<!--
  The 2D control surface (labs/prd-agent-play.md sec 7). NOT a second game
  client: it renders NO world and holds NO game logic. It is a thin,
  dependency-free view over the SAME two verbs the engine exposes --
  observe() and act() -- so one surface serves three jobs:
    * admin console (drive/inspect a session without the 3D client),
    * accessibility control surface (screen-reader / switch users drive the
      real game through stable action ids, not pixels),
    * agent watcher (a human watches and signs off what an agent does).
  It auto-picks transport via SynmergiaCompanion: in-page when embedded in the
  game, else remote to the AgentDoor (default http://127.0.0.1:3789).
-->
<style>
  :root {
    --bg: #10131a; --panel: #181d27; --line: #2a3140; --ink: #e6ebf2;
    --dim: #93a1b5; --accent: #6ea8fe; --ok: #3fb950; --bad: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .3px; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.bad { color: var(--bad); border-color: var(--bad); }
  .pill.warn { color: var(--warn); border-color: var(--warn); }
  main { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 12px; padding: 12px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); margin: 0 0 8px; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 6px 0 2px; }
  input, select, textarea, button {
    font: inherit; color: var(--ink); background: #0d1016; border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px;
  }
  input, select, textarea { width: 100%; }
  textarea { min-height: 54px; resize: vertical; }
  button { cursor: pointer; background: #1d2432; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 0 0 auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions button { text-align: left; width: 100%; margin: 3px 0; }
  .actions button[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; color: var(--dim); }
  .log { max-height: 240px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  .log div { padding: 1px 0; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
  .kv dt { color: var(--dim); }
  .kv dd { margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: normal; }
  .muted { color: var(--dim); font-size: 12px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<header>
  <h1>Synmergia Control Surface</h1>
  <span id="conn" class="pill warn" role="status" aria-live="polite">connecting...</span>
  <span id="scene" class="muted"></span>
  <span class="row" style="margin-left:auto">
    <label for="door" class="sr-only">Door URL</label>
    <input id="door" style="width:220px" value="http://127.0.0.1:3789" aria-label="Agent door URL" />
    <button id="connect">Connect</button>
    <button id="refresh">Refresh</button>
  </span>
</header>

<main>
  <section aria-labelledby="h-snap">
    <h2 id="h-snap">Snapshot (observe)</h2>
    <dl class="kv" id="snapshot"><dt>state</dt><dd>waiting...</dd></dl>
    <label for="chat">Say</label>
    <div class="row">
      <input id="chat" placeholder="message" aria-label="Chat message" />
      <button id="say">Say</button>
    </div>
  </section>

  <section aria-labelledby="h-act">
    <h2 id="h-act">Actions (act)</h2>
    <div class="row">
      <button data-verb="move" data-args='{"forward":1}'>Forward</button>
      <button data-verb="move" data-args='{"forward":-1}'>Back</button>
      <button data-verb="move" data-args='{"strafe":-1}'>Left</button>
      <button data-verb="move" data-args='{"strafe":1}'>Right</button>
      <button data-verb="stop">Stop</button>
      <button data-verb="attack">Attack</button>
      <button data-verb="interact">Interact</button>
    </div>
    <label for="actions">Actionable ids (from the world)</label>
    <div class="actions" id="actions" role="group" aria-label="World actions"></div>
  </section>

  <section aria-labelledby="h-agents">
    <h2 id="h-agents">Agents (coordinator)</h2>
    <div class="grid2">
      <div>
        <label for="a-handle">Handle</label>
        <input id="a-handle" placeholder="alpha" aria-label="Agent handle" />
      </div>
      <div>
        <label for="a-role">Role</label>
        <input id="a-role" placeholder="scout" aria-label="Agent role" />
      </div>
    </div>
    <div class="row" style="margin-top:6px">
      <button id="a-register">Register</button>
      <button id="a-step">Step turn</button>
      <button id="a-run">Run to idle</button>
    </div>
    <table style="margin-top:8px">
      <caption class="sr-only">Registered agents</caption>
      <thead><tr><th>handle</th><th>role</th><th>state</th><th>queued</th><th>actions</th></tr></thead>
      <tbody id="roster"><tr><td colspan="5" class="muted">none</td></tr></tbody>
    </table>
    <label for="a-task">Delegate task (JSON: {"verb":"move","args":{"forward":1}})</label>
    <textarea id="a-task" aria-label="Task JSON">{"verb":"move","args":{"forward":1}}</textarea>
    <div class="row">
      <input id="a-target" placeholder="handle" aria-label="Delegate target handle" style="width:120px" />
      <button id="a-delegate">Delegate</button>
    </div>
    <label>Work awaiting sign-off</label>
    <div id="gate" class="muted">none</div>
  </section>

  <section aria-labelledby="h-events" style="grid-column: 1 / -1;">
    <h2 id="h-events">Events</h2>
    <div id="events" class="log" role="log" aria-live="polite" aria-label="Recent events"></div>
  </section>
</main>

<script src="shared/agent-client.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var companion = null;
  var lastEventFrame = -1;

  function setConn(text, cls) {
    var el = $("conn");
    el.textContent = text;
    el.className = "pill " + (cls || "");
  }

  function connect() {
    var url = $("door").value.trim() || undefined;
    companion = window.SynmergiaCompanion.auto(url);
    if (companion.ready) {
      setConn("connected", "ok");
      tick();
    } else {
      setConn("door closed (set SYN_AGENT=1)", "bad");
    }
  }

  function renderSnapshot(s) {
    if (!s || s.ok === false) {
      $("snapshot").innerHTML = "<dt>state</dt><dd>" + ((s && s.reason) || "no data") + "</dd>";
      return;
    }
    $("scene").textContent = s.scene ? ("scene: " + s.scene) : "";
    var p = s.player || {};
    var rows = [
      ["in world", s.in_world ? "yes" : "no"],
      ["player", p.name || p.id || "-"],
      ["hp", p.hp != null ? (p.hp + "/" + (p.hp_max || "?")) : "-"],
      ["pos", p.pos ? ("[" + [p.pos.x, p.pos.y, p.pos.z].map(function (n) { return Math.round(n); }).join(", ") + "]") : "-"],
      ["target", (s.target && (s.target.name || s.target.id)) || "-"],
      ["party", s.party ? (s.party.size || (s.party.members || []).length || 0) : 0]
    ];
    $("snapshot").innerHTML = rows.map(function (r) {
      return "<dt>" + r[0] + "</dt><dd>" + String(r[1]) + "</dd>";
    }).join("");
    renderActions(s.actions || []);
  }

  function renderActions(actions) {
    var box = $("actions");
    box.innerHTML = "";
    if (!actions.length) { box.innerHTML = "<span class='muted'>none</span>"; return; }
    actions.forEach(function (a) {
      var b = document.createElement("button");
      b.textContent = (a.action || a.id || "?") + (a.disabled ? " (disabled)" : "");
      b.setAttribute("aria-disabled", a.disabled ? "true" : "false");
      b.addEventListener("click", function () { doAct(a.id || a.action, a.args || {}); });
      box.appendChild(b);
    });
  }

  function renderRoster(status) {
    var tbody = $("roster");
    var agents = (status && status.agents) || [];
    tbody.innerHTML = "";
    if (!agents.length) { tbody.innerHTML = "<tr><td colspan='5' class='muted'>none</td></tr>"; return; }
    agents.forEach(function (a) {
      var tr = document.createElement("tr");
      tr.innerHTML = "<td>" + a.handle + "</td><td>" + a.role + "</td><td>" + a.state + "</td><td>" + a.queued + "</td>";
      var td = document.createElement("td");
      var actions = [["pause", "pause"], ["resume", "resume"], ["unregister", "kill"], ["queue", "queue"]];
      actions.forEach(function (pair) {
        var b = document.createElement("button");
        b.textContent = pair[1];
        b.style.padding = "1px 6px";
        b.addEventListener("click", function () { coord(pair[0], { handle: a.handle }); });
        td.appendChild(b);
        td.appendChild(document.createTextNode(" "));
      });
      tr.appendChild(td);
      tbody.appendChild(tr);
    });
    renderGate(agents);
  }

  function renderGate(agents) {
    var box = $("gate");
    box.innerHTML = "";
    var any = false;
    agents.forEach(function (a) {
      if (!a.queued) return;
      var wrap = document.createElement("div");
      wrap.className = "row";
      wrap.innerHTML = "<span>" + a.handle + " (" + a.queued + ")</span>";
      var ap = document.createElement("button"); ap.textContent = "approve next";
      ap.addEventListener("click", function () { coord("approve", { handle: a.handle, work_id: 0 }); });
      var rj = document.createElement("button"); rj.textContent = "reject next";
      rj.addEventListener("click", function () { coord("reject", { handle: a.handle, work_id: 0, reason: "operator" }); });
      wrap.appendChild(ap); wrap.appendChild(rj);
      box.appendChild(wrap);
      any = true;
    });
    if (!any) box.innerHTML = "<span class='muted'>none</span>";
  }

  function renderEvents(events) {
    var box = $("events");
    if (!events || !events.length) return;
    events.forEach(function (e) {
      var f = e.frame != null ? e.frame : -1;
      if (f <= lastEventFrame) return;
      lastEventFrame = f;
      var d = document.createElement("div");
      d.textContent = "[" + f + "] " + (e.event || "?") + " " + JSON.stringify(e.data || {});
      box.appendChild(d);
    });
    while (box.childNodes.length > 200) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }

  async function doAct(id, args) {
    if (!companion || !companion.ready) { setConn("not connected", "bad"); return; }
    var r = await companion.act(id, args || {});
    if (r && r.ok === false) pushLocal("act refused: " + (r.reason || "?"));
    tick();
  }

  async function coord(op, extra) {
    if (!companion || !companion.ready) { setConn("not connected", "bad"); return; }
    var r = await companion.coord(op, extra || {});
    if (op === "register") { $("a-handle").value = ""; }
    tick();
    return r;
  }

  function pushLocal(text) {
    var box = $("events");
    var d = document.createElement("div");
    d.textContent = "[local] " + text;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }

  async function tick() {
    if (!companion || !companion.ready) return;
    var s = await companion.observe();
    renderSnapshot(s);
    var st = await companion.coord("status");
    if (st && st.ok) renderRoster(st);
    var ev = await companion.events(lastEventFrame);
    if (Array.isArray(ev)) renderEvents(ev);
  }

  $("connect").addEventListener("click", connect);
  $("refresh").addEventListener("click", tick);
  $("say").addEventListener("click", function () {
    var t = $("chat").value.trim();
    if (t) { doAct("chat", { text: t, channel: "say" }); $("chat").value = ""; }
  });
  document.querySelectorAll("button[data-verb]").forEach(function (b) {
    b.addEventListener("click", function () {
      var args = b.dataset.args ? JSON.parse(b.dataset.args) : {};
      doAct(b.dataset.verb, args);
    });
  });
  $("a-register").addEventListener("click", function () {
    coord("register", { handle: $("a-handle").value.trim(), opts: { role: $("a-role").value.trim() || "assistant" } });
  });
  $("a-step").addEventListener("click", function () { coord("step"); });
  $("a-run").addEventListener("click", function () { coord("run"); });
  $("a-delegate").addEventListener("click", function () {
    var task;
    try { task = JSON.parse($("a-task").value); } catch (e) { pushLocal("bad task JSON"); return; }
    coord("delegate", { handle: $("a-target").value.trim(), task: task });
  });

  setInterval(tick, 1000);
  connect();
})();
</script>
</body>
</html>
