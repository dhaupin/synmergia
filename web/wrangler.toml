# Cloudflare Workers configuration for Synmergia web client.
#
# Deploy with: `wrangler deploy`
# Set up secrets: `wrangler secret put JWT_SECRET` etc.

name = "synmergia-web"
main = "worker.js"
compatibility_date = "2024-09-23"
workers_dev = false

# Environment variables
[vars]
# Production endpoints use the documented play.synmergia.com host.
# Server WebSocket URL (wss://)
SERVER_URL = "wss://play.synmergia.com/ws"
# REST API URL
API_URL = "https://play.synmergia.com"
# Godot engine debug mode
DEBUG = false

# The worker is stateless, so KV and Durable Object bindings are not required.
# Routes
# Serve static files from /web/ directory
# Proxy WebSocket connections to the server

# Production custom domain.
[env.production]
name = "synmergia-web-prod"
workers_dev = false
routes = [
	{ pattern = "play.synmergia.com", custom_domain = true },
]

[env.production.vars]
SERVER_URL = "wss://play.synmergia.com/ws"
API_URL = "https://play.synmergia.com"
DEBUG = false

# Staging domain is a placeholder until a Cloudflare zone is provisioned.
[env.staging]
name = "synmergia-web-staging"
workers_dev = false
routes = [
	{ pattern = "staging.synmergia.example.com", custom_domain = true },
]

[env.staging.vars]
SERVER_URL = "wss://staging.synmergia.example.com/ws"
API_URL = "https://staging.synmergia.example.com"
DEBUG = true

# Development
[dev]
ip = "0.0.0.0"
port = 8788
local_protocol = "http"