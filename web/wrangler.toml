# Cloudflare Workers configuration for Synmergia web client.
#
# Deploy with: `wrangler deploy`
# Set up secrets: `wrangler secret put JWT_SECRET` etc.

name = "synmergia-web"
main = "worker.js"
compatibility_date = "2024-09-23"

# ── Environment variables ─────────────────────────────────────────────
[vars]
# Server WebSocket URL (wss://)
SERVER_URL = "wss://synmergia.example.com/ws"
# REST API URL
API_URL = "https://api.synmergia.example.com"
# Godot engine debug mode
DEBUG = false

# ── Routes ────────────────────────────────────────────────────────────
# Serve static files from /web/ directory
# Proxy WebSocket connections to the server
# Cache static assets with long TTL

[env.production]
name = "synmergia-web-prod"
routes = { pattern = "synmergia.example.com/*", custom_domain = true }

[env.production.vars]
SERVER_URL = "wss://synmergia.example.com/ws"
API_URL = "https://api.synmergia.example.com"

[env.staging]
name = "synmergia-web-staging"
routes = { pattern = "staging.synmergia.example.com/*", custom_domain = true }

[env.staging.vars]
SERVER_URL = "wss://staging.synmergia.example.com/ws"
API_URL = "https://staging.synmergia.example.com"
DEBUG = true

# ── Static asset caching ─────────────────────────────────────────────
# WASM files: immutable, cache forever
[[routes]]
pattern = "/*.wasm"
cache_ttl = 31536000
cache_level = "cache"

# PCK files: immutable, cache forever
[[routes]]
pattern = "/*.pck"
cache_ttl = 31536000
cache_level = "cache"

# JS files: cache for 1 day (allow updates)
[[routes]]
pattern = "/*.js"
cache_ttl = 86400
cache_level = "cache"

# HTML/CSS: no cache (always fresh)
[[routes]]
pattern = "/*.html"
cache_ttl = 0
cache_level = "bypass"

[[routes]]
pattern = "/*.css"
cache_ttl = 0
cache_level = "bypass"

# ── Development ───────────────────────────────────────────────────────
[dev]
ip = "0.0.0.0"
port = 8788
local_protocol = "http"