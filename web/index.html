<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="description" content="Synmergia - A free and open source MMORPG">
	<meta name="theme-color" content="#0b0e14">
	<title>Synmergia</title>
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="stylesheet" href="style.css">
	<style>
		/* Keep the existing style.css look; these rules only add the
		 * progress bar and fullscreen affordance. */
		#loading-bar {
			width: min(420px, 70vw);
			height: 8px;
			margin: 14px auto 0;
			border: 1px solid #2a3245;
			border-radius: 6px;
			background: #141926;
			overflow: hidden;
		}
		#loading-bar-fill {
			width: 0%;
			height: 100%;
			background: linear-gradient(90deg, #b98a2f, #e8b64c);
			transition: width 0.15s linear;
		}
		#fullscreen-btn {
			display: block;
			margin: 16px auto 0;
			padding: 10px 22px;
			border: 1px solid #2a3245;
			border-radius: 8px;
			background: #141926;
			color: #d7dce8;
			font-size: 14px;
			cursor: pointer;
		}
		#fullscreen-btn:hover {
			border-color: #e8b64c;
			color: #e8b64c;
		}
	</style>
</head>
<body>
	<div id="game-container">
		<canvas id="game-canvas" tabindex="1"></canvas>
		<div id="loading-screen">
			<div class="spinner"></div>
			<p id="loading-text">Loading Synmergia...</p>
			<div id="loading-bar"><div id="loading-bar-fill"></div></div>
			<button id="fullscreen-btn">Fullscreen</button>
		</div>
		<div id="error-screen" class="hidden">
			<h2>Failed to load</h2>
			<p id="error-text">Please try again or contact support.</p>
			<button onclick="location.reload()">Retry</button>
		</div>
	</div>
	<script src="config.js"></script>
	<!-- SynmergiaInput capture layer (optional). The Godot web runtime
	     delivers mouse/touch/keyboard natively, so this page does NOT
	     auto-init it -- initializing would double-deliver input alongside
	     the engine's own handlers. Embedded wrappers that need the buffered
	     path (see labs/prd-web.md) call:
	         SynmergiaInput.init(document.getElementById('game-canvas'));
	     The WebInputBridge autoload drains it only when initialized. -->
	<script src="shared/input.js"></script>
	<script src="game.js"></script>
	<script>
	(function () {
		"use strict";

		var canvas = document.getElementById("game-canvas");
		var loading = document.getElementById("loading-screen");
		var errorScreen = document.getElementById("error-screen");
		var errorText = document.getElementById("error-text");
		var loadingText = document.getElementById("loading-text");
		var barFill = document.getElementById("loading-bar-fill");

		// Capture layer is present but intentionally not auto-initialized
		// (see the note above the script tag). Godot's web runtime handles
		// input natively on this page; wrappers opt in via SynmergiaInput.init().
		window.SynmergiaInputAvailable = typeof SynmergiaInput !== "undefined";

		document.getElementById("fullscreen-btn").addEventListener("click", function () {
			var el = document.documentElement;
			if (el.requestFullscreen) {
				el.requestFullscreen().catch(function () {});
			}
		});

		function fail(message) {
			loading.classList.add("hidden");
			errorText.textContent = message;
			errorScreen.classList.remove("hidden");
		}

		function setProgress(current, total) {
			if (current > 0 && total > 0) {
				var pct = Math.round((current / total) * 100);
				barFill.style.width = pct + "%";
				loadingText.textContent = "Loading Synmergia... " + pct + "%";
			}
		}

		// Contract with game.js (Godot 4.7.2's exported launcher): it defines
		// the Engine class; GODOT_CONFIG mirrors Godot's generated shell
		// (exported to builds/web-shell/ as a reference; THIS file is the
		// shipped shell) -- resize policy, thread pool sizes, and the
		// fileSizes that drive honest download progress. All asset
		// references are RELATIVE so the shell works served under /web/.
		// NOTE: initial WASM heap is baked at export time (the glue's
		// getModuleConfig whitelists what reaches the Module -- memory is
		// not settable from here; Emscripten grows the heap at runtime).
		var GODOT_THREADS_ENABLED = true;

		var GODOT_CONFIG = {
			"args": [],
			"canvasResizePolicy": 2,
			"emscriptenPoolSize": 8,
			"ensureCrossOriginIsolationHeaders": true,
			"executable": "game",
			"experimentalVK": true,
			"fileSizes": { "game.pck": 4670752, "game.wasm": 38820072 },
			"focusCanvas": true,
			"gdextensionLibs": [],
			"godotPoolSize": 4,
		};

		if (typeof Engine === "undefined") {
			fail("game.js failed to load (Engine unavailable). The client must be served from /web/ -- a reload usually fixes a stale deploy.");
			return;
		}

		var missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
		if (missing.length !== 0) {
			fail("Your browser is missing required features:\n" + missing.join("\n"));
			return;
		}

		// Content-addressed pack: read
		// game.pck.hash (CI rewrites it on every content change) and point
		// mainPack at game.pck?v=<hash>. The filename never mutates -- the
		// query string makes the URL unique per build, so the browser caches
		// each pack exactly once and refreshes re-validate ~65 bytes, never
		// the multi-MB pack. On any hash failure: the bare path (server
		// then decides caching), never a hard block.
		function startWithPack(packUrl) {
			var cfg = GODOT_CONFIG;
			cfg.mainPack = packUrl;
			var progressSeen = false;
			var lastPct = -1;
			// The launcher reads progress from BOTH surfaces: the Engine
			// config (onProgress at config level) and startGame options.
			// Setting only the startGame option let some exports read the
			// config-level key instead (play-day round 6: the pre-game
			// loader showed no percent). Wire both; whichever surface the
			// engine honors, the bar moves.
			var onProg = function (current, total) {
				progressSeen = progressSeen || current > 0;
				if (current > 0 && total > 0) {
					var pct = Math.round((current / total) * 100);
					if (pct !== lastPct) {
						lastPct = pct;
						barFill.style.width = pct + "%";
						loadingText.textContent = "Loading Synmergia... " + pct + "% (" + (current / 1048576).toFixed(1) + " / " + (total / 1048576).toFixed(1) + " MB)";
					}
				}
			};
			cfg.onProgress = onProg;
			var engine = new Engine(cfg);
			engine.startGame({
				"onProgress": onProg,
			}).then(function () {
				loading.classList.add("hidden");
				canvas.focus();
			}).catch(function (err) {
				console.error(err);
				fail(err && err.message ? err.message : "Engine failed to start.");
			});
		}

		fetch('game.pck.hash', { cache: 'no-cache' })
			.then((r) => (r.ok ? r.text() : Promise.reject(new Error('no hash'))))
			.then((h) => {
				const hash = h.trim();
				startWithPack(hash !== '' ? 'game.pck?v=' + encodeURIComponent(hash) : 'game.pck');
			})
			.catch(() => startWithPack('game.pck'));

		// The watchdog: only fires when NOTHING ever progressed (a stalled
		// download or a blocked asset). A slow pck that shows % never trips.
		setTimeout(function () {
			if (!progressSeen && !loading.classList.contains("hidden")) {
				fail("Engine did not make progress in time. Check your connection and reload.");
			}
		}, 20000);
	})();
	</script>
</body>
</html>
