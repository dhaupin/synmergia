<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="description" content="Synmergia - A free and open source MMORPG">
	<meta name="theme-color" content="#0b0e14">
	<title>Synmergia</title>
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="stylesheet" href="style.css">
	<style>
		/* Keep the existing style.css look; these rules only add the
		 * progress bar and fullscreen affordance. */
		#loading-bar {
			width: min(420px, 70vw);
			height: 8px;
			margin: 14px auto 0;
			border: 1px solid #2a3245;
			border-radius: 6px;
			background: #141926;
			overflow: hidden;
		}
		#loading-bar-fill {
			width: 0%;
			height: 100%;
			background: linear-gradient(90deg, #b98a2f, #e8b64c);
			transition: width 0.15s linear;
		}
		#fullscreen-btn {
			display: block;
			margin: 16px auto 0;
			padding: 10px 22px;
			border: 1px solid #2a3245;
			border-radius: 8px;
			background: #141926;
			color: #d7dce8;
			font-size: 14px;
			cursor: pointer;
		}
		#fullscreen-btn:hover {
			border-color: #e8b64c;
			color: #e8b64c;
		}
	</style>
</head>
<body>
	<div id="game-container">
		<canvas id="game-canvas" tabindex="1"></canvas>
		<div id="loading-screen">
			<div class="spinner"></div>
			<p id="loading-text">Loading Synmergia...</p>
			<div id="loading-bar"><div id="loading-bar-fill"></div></div>
			<button id="fullscreen-btn">Fullscreen</button>
		</div>
		<div id="error-screen" class="hidden">
			<h2>Failed to load</h2>
			<p id="error-text">Please try again or contact support.</p>
			<button onclick="location.reload()">Retry</button>
		</div>
	</div>
	<script src="config.js"></script>
	<!-- SynmergiaInput capture layer (optional). The Godot web runtime
	     delivers mouse/touch/keyboard natively, so this page does NOT
	     auto-init it -- initializing would double-deliver input alongside
	     the engine's own handlers. Embedded wrappers that need the buffered
	     path (see labs/prd-web.md) call:
	         SynmergiaInput.init(document.getElementById('game-canvas'));
	     The WebInputBridge autoload drains it only when initialized. -->
	<script src="shared/input.js"></script>
	<script src="game.js"></script>
	<script>
	(function () {
		"use strict";

		var canvas = document.getElementById("game-canvas");
		var loading = document.getElementById("loading-screen");
		var errorScreen = document.getElementById("error-screen");
		var errorText = document.getElementById("error-text");
		var loadingText = document.getElementById("loading-text");
		var barFill = document.getElementById("loading-bar-fill");

		// Capture layer is present but intentionally not auto-initialized
		// (see the note above the script tag). Godot's web runtime handles
		// input natively on this page; wrappers opt in via SynmergiaInput.init().
		window.SynmergiaInputAvailable = typeof SynmergiaInput !== "undefined";

		document.getElementById("fullscreen-btn").addEventListener("click", function () {
			var el = document.documentElement;
			if (el.requestFullscreen) {
				el.requestFullscreen().catch(function () {});
			}
		});

		function fail(message) {
			loading.classList.add("hidden");
			errorText.textContent = message;
			errorScreen.classList.remove("hidden");
		}

		// A lost WebGL2 context mid-game renders as a SILENT BLACK canvas
		// (the exact "in-game viewport is black" report class). Surface it
		// with an actionable message instead of a void.
		canvas.addEventListener("webglcontextlost", function (e) {
			e.preventDefault();
			fail("The graphics context was lost (GPU driver or browser tab reclamation). Reload the page to resume.");
		});

		function setProgress(current, total) {
			if (current > 0 && total > 0) {
				var pct = Math.round((current / total) * 100);
				barFill.style.width = pct + "%";
				loadingText.textContent = "Loading Synmergia... " + pct + "%";
			}
		}

		// Live file sizes (round 8, item 1): the launcher tracks progress
		// with PER-FILE totals taken ONLY from config.fileSizes -- it never
		// reads Content-Length. It looks the pack size up by the EXACT
		// mainPack string, so a content-addressed 'game.pck?v=<hash>' key
		// must exist (the old static 'game.pck' key missed, the pack
		// tracked total 0, the aggregate total invalidated to 0, and the
		// bar never moved). HEAD both files here for the REAL sizes; the
		// static fileSizes below stay as a fallback for a HEAD-less
		// server, and onProgress falls back to their sum when the engine
		// reports an invalid (0) aggregate total.

		// Contract with game.js (Godot 4.7.2's exported launcher): it defines
		// the Engine class; GODOT_CONFIG mirrors Godot's generated shell
		// (exported to builds/web-shell/ as a reference; THIS file is the
		// shipped shell) -- resize policy, thread pool sizes, and the
		// fileSizes that drive honest download progress. All asset
		// references are RELATIVE so the shell works served under /web/.
		// NOTE: initial WASM heap is baked at export time (the glue's
		// getModuleConfig whitelists what reaches the Module -- memory is
		// not settable from here; Emscripten grows the heap at runtime).
		var GODOT_THREADS_ENABLED = true;

		// Set the moment the engine prints its version banner. startGame's
		// promise is NOT a reliable success signal: after the worker pool
		// takes over, the main thread's pck/wasm reads abort (net::ERR_ABORTED
		// in the console) and the promise REJECTS -- on a fully booted,
		// ticking game. The banner is the truth; the catch below checks it.
		var engineBooted = false;

		var GODOT_CONFIG = {
			"args": [],
			"canvasResizePolicy": 2,
			"emscriptenPoolSize": 8,
			"ensureCrossOriginIsolationHeaders": true,
			"executable": "game",
			"experimentalVK": true,
			"fileSizes": { "game.pck": 12165624, "game.wasm": 38820072 },
			"focusCanvas": true,
			"gdextensionLibs": [],
			"godotPoolSize": 4,
			"onPrint": function (msg) {
				// Preserve the default console routing (setting onPrint here
				// replaces the template's own print bridge).
				console.log(msg);
				if (!engineBooted && String(msg).indexOf("Godot Engine v") !== -1) {
					engineBooted = true;
					// Belt-and-braces hide: even if startGame hangs after
					// boot, the player must see the game, not a loader.
					loading.classList.add("hidden");
					canvas.focus();
				}
			},
		};

	if (typeof Engine === "undefined") {
		fail("game.js failed to load (Engine unavailable). The client must be served from /game/ -- a reload usually fixes a stale deploy.");
		return;
	}

		var missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
		if (missing.length !== 0) {
			fail("Your browser is missing required features:\n" + missing.join("\n"));
			return;
		}

		// Watchdog state lives HERE (IIFE scope). It used to live inside
		// startWithPack(), so this 20s timer read an undefined identifier,
		// threw 'progressSeen is not defined' on EVERY load at 20s, and the
		// stall safety net below never actually ran.
		var anyProgressSeen = false;

		// Content-addressed pack: read
		// game.pck.hash (CI rewrites it on every content change) and point
		// mainPack at game.pck?v=<hash>. The filename never mutates -- the
		// query string makes the URL unique per build, so the browser caches
		// each pack exactly once and refreshes re-validate ~65 bytes, never
		// the multi-MB pack. On any hash failure: the bare path (server
		// then decides caching), never a hard block.
		function startWithPack(packUrl) {
			var cfg = GODOT_CONFIG;
			cfg.mainPack = packUrl;
			var lastPct = -1;
			var knownTotal = 0;
			// Per-file display (pass 3): the real HEADed sizes live here so
			// onProg (defined below, called later by the engine) can label
			// WHICH file the player is waiting on.
			var wasmSize = 0;
			var pckSize = 0;
			// The launcher reads progress from BOTH surfaces: the Engine
			// config (onProgress at config level) and startGame options.
			// Setting only the startGame option let some exports read the
			// config-level key instead (play-day round 6: the pre-game
			// loader showed no percent). Wire both; whichever surface the
			// engine honors, the bar moves.
		var onProg = function (current, total) {
			anyProgressSeen = anyProgressSeen || current > 0;
			// One file with an unknown size invalidates the engine's
			// aggregate total (it zeroes it) -- fall back to the sum we
			// HEADed before start. Cap at 100: a stale fallback size
			// must not show a bar that runs past full.
			var denom = total > 0 ? total : knownTotal;
			if (current > 0 && denom > 0) {
				var pct = Math.min(100, Math.round((current / denom) * 100));
				if (pct !== lastPct) {
					lastPct = pct;
					barFill.style.width = pct + "%";
					// Per-file truth line (play-day pass 3): the engine reports
					// one aggregate counter over >50 MB of files, but the two
					// halves age differently — the 38.8 MB engine pair usures
					// immutable in the browser cache (1-year policy), the
					// ~13 MB pack re-downloads whenever the hash changes.
					// Guessing by the CURRENT byte count is exact whenever
					// current sits inside one file's band (the engine loads
					// wasm fully before touching the pack), and competitive
					// per-file labels let the player KNOW what they wait on.
					var mb = function (v) { return (v / 1048576).toFixed(1); };
					var phase;
					if (wasmSize > 0 && current < wasmSize) {
						phase = "engine (cached after first visit) "+ mb(Math.min(current, wasmSize)) + " / " + mb(wasmSize) + " MB";
					} else {
						phase = "world data "+ mb(current - (wasmSize || 0)) + " / " + mb(pckSize || (denom - (wasmSize || 0))) + " MB";
					}
					loadingText.textContent = "Loading Synmergia... " + pct + "% — " + phase;
				}
			}
		};
			cfg.onProgress = onProg;
			var headSize = function (url) {
				return fetch(url, { method: "HEAD", cache: "no-cache" }).then(function (r) {
					var len = parseInt(r.headers.get("content-length") || "0", 10);
					return isFinite(len) && len > 0 ? len : 0;
				}).catch(function () { return 0; });
			};
			// Sizes keyed BOTH ways: the wasm is looked up as '<exe>.wasm',
			// the pack as the EXACT mainPack string (query included) -- plus
			// the bare 'game.pck' key for any code path that asks for it.
			Promise.all([headSize("game.wasm"), headSize(packUrl)]).then(function (sizes) {
				// Assign to the OUTER vars (hoisted at startWithPack top) so
				// onProg's per-file labels read the real HEADed sizes.
				wasmSize = sizes[0] || (cfg.fileSizes["game.wasm"] || 0);
				pckSize = sizes[1] || (cfg.fileSizes["game.pck"] || 0);
				if (wasmSize > 0) cfg.fileSizes["game.wasm"] = wasmSize;
				if (pckSize > 0) {
					cfg.fileSizes["game.pck"] = pckSize;
					cfg.fileSizes[packUrl] = pckSize;
				}
				// The hardcoded fileSizes above go stale the moment content
				// changes (CI re-packs but never rewrites this file) -- the
				// real HEAD sizes are the truth for progress math.
				knownTotal = wasmSize + pckSize;
				var engine = new Engine(cfg);
				engine.startGame({
					"onProgress": onProg,
				}).then(function () {
					loading.classList.add("hidden");
					canvas.focus();
				}).catch(function (err) {
					// Post-boot rejections are NOT failures: the engine is
					// alive and ticking (banner already printed) -- the old
					// code painted the error screen over the running game.
					// Abort-style rejections from the worker handoff (the
					// main thread's pck/wasm reads abort) are equally not
					// failures even if the banner has not landed yet; a
					// genuinely dead engine fails the missing-features gate
					// or the watchdog instead.
					var aborted = err && (err.name === "AbortError" || /abort/i.test(String(err.message || err)));
					if (engineBooted || aborted) {
						console.warn("Ignoring post-boot engine rejection (engine is live):", err);
						loading.classList.add("hidden");
						canvas.focus();
						return;
					}
					console.error(err);
					fail(err && err.message ? err.message : "Engine failed to start.");
				});
			}).catch(function () {
				fail("Could not size the engine download. Check your connection and reload.");
			});
		}

		fetch('game.pck.hash', { cache: 'no-cache' })
			.then((r) => (r.ok ? r.text() : Promise.reject(new Error('no hash'))))
			.then((h) => {
				const hash = h.trim();
				startWithPack(hash !== '' ? 'game.pck?v=' + encodeURIComponent(hash) : 'game.pck');
			})
			.catch(() => startWithPack('game.pck'));

		// The watchdog: only fires when NOTHING ever progressed (a stalled
		// download or a blocked asset). A slow pck that shows % never trips.
		setTimeout(function () {
			if (!anyProgressSeen && !loading.classList.contains("hidden")) {
				fail("Engine did not make progress in time. Check your connection and reload.");
			}
		}, 20000);
	})();
	</script>
</body>
</html>
